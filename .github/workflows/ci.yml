name: Rails CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare test database
        env:
          RAILS_ENV: test
        run: bin/rails db:prepare

      - name: Run Rails tests
        env:
          RAILS_ENV: test
        run: bin/rails test

      - name: Verify production assets compile
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: "1"
        run: bin/rails assets:precompile
